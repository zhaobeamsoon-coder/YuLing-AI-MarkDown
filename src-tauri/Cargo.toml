[package]
name = "yuling-md"
version = "0.1.0"
description = "YuLing MD desktop editor"
authors = ["YuLing AI"]
edition = "2021"
license = "MIT"

[lib]
name = "yuling_md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
futures-util = "0.3.31"
hex = "0.4.3"
hmac = "0.12.1"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
security-framework = "3.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sha1 = "0.10.6"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["io-util", "process", "time"] }
trash = { version = "5.2.6", default-features = false }
url = "2.5.8"
walkdir = "2.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSError", "NSString"] }
objc2-pdf-kit = { version = "0.3.2", features = ["PDFDocument", "PDFPage"] }
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "WKPDFConfiguration", "block2", "objc2-core-foundation"] }

[dev-dependencies]
tempfile = "3.24.0"
